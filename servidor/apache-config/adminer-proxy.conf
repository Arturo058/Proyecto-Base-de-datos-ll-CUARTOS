# ==============================================================================
# Proxy inverso: expone Adminer bajo la ruta /adminer/ del mismo dominio/IP
# que la aplicación principal, sin publicar el puerto 8080 al exterior.
# ==============================================================================

<Location /adminer/>
    ProxyPass        http://interfaz_adminer:8080/
    ProxyPassReverse http://interfaz_adminer:8080/
</Location>

ProxyPassReverseCookiePath / /adminer/

# ==============================================================================
# ENDURECIMIENTO: como el volumen monta TODO el proyecto en /var/www/html,
# Apache serviría por defecto (como descarga pública) archivos que NO deben
# ser accesibles desde internet.
# ==============================================================================
<FilesMatch "\.(sql|yml|yaml|env|md)$">
    Require all denied
</FilesMatch>

<Directory "/var/www/html/apache-config">
    Require all denied
</Directory>

<Directory "/var/www/html/includes">
    Require all denied
</Directory>
